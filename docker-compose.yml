version: '3.8'

services:
  # 1. Base de Datos Relacional (MariaDB)
  db:
    image: mariadb:10.11
    container_name: planeta_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: planeta_db
      MYSQL_USER: planeta_user
      MYSQL_PASSWORD: planeta_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 2. Caché Semántico y Colas (Redis)
  redis:
    image: redis:7-alpine
    container_name: planeta_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Base de Datos Vectorial para RAG (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: planeta_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. El Núcleo Central (Django)
  backend:
    build: ./backend
    container_name: planeta_backend
    env_file:
      - ./backend/.env
    # Encendemos el servidor para que escuche hacia el exterior
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - qdrant

volumes:
  mariadb_data:
  redis_data:
  qdrant_data:
  