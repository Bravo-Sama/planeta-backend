version: '3.8'

services:
  # 1. Base de Datos Relacional (MariaDB)
  db:
    image: mariadb:10.11
    container_name: planeta_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: planeta_db
      MYSQL_USER: planeta_user
      MYSQL_PASSWORD: planeta_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # 2. Caché Semántico y Colas (Redis)
  redis:
    image: redis:7-alpine
    container_name: planeta_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Base de Datos Vectorial para RAG (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: planeta_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. El Núcleo Central (Django)
  backend:
    build: ./backend
    container_name: planeta_backend
    # Encendemos el servidor para que escuche hacia el exterior
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - qdrant

  # 5. El Orquestador (n8n)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: planeta_n8n
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - WEBHOOK_URL=https://opulently-angling-atop.ngrok-free.dev
      - GENERIC_TIMEZONE=America/Santiago

volumes:
  mariadb_data:
  redis_data:
  qdrant_data:
  # Declaramos el volumen de n8n como externo para que use el que ya tiene tus flujos guardados
  n8n_data:
    external: true