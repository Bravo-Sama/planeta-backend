<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Motor RAG - Aguas Décimas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 50px; }
        .contenedor { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-size: 16px; }
        button:hover { background-color: #004494; }
        textarea { width: 100%; margin-top: 20px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Ingesta de Documentos</h1>
        <p>Sube un manual o boleta en formato PDF para entrenar a la IA.</p>
        
        <!-- El formulario que envía el archivo a Django -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="documento_pdf" accept=".pdf" required>
            <br>
            <button type="submit">Procesar y Extraer Texto</button>
        </form>

        <!-- Aquí se mostrará el texto extraído si el procesamiento es exitoso -->
        {% if texto_extraido %}
            <h3 style="color: green;">¡PDF procesado con éxito!</h3>
            <textarea rows="15" readonly>{{ texto_extraido }}</textarea>
        {% endif %}
    </div>
</body>
</html>
