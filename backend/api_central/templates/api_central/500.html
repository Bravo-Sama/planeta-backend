<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento | Sistema IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="text-center">
        <i class="bi bi-cone-striped text-warning mb-3" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold text-white mt-3">Mantenimiento del Sistema</h1>
        <p class="text-secondary mt-3 mb-4 mx-auto" style="max-width: 500px;">
            El motor de la plataforma o la base de datos están experimentando dificultades técnicas. Nuestro equipo ya ha sido notificado.
        </p>
        <div class="alert alert-warning d-inline-block px-4 py-2" role="alert">
            <i class="bi bi-clock-history me-2"></i> Por favor, intenta acceder nuevamente en unos minutos.
        </div>
    </div>
</body>
</html>
