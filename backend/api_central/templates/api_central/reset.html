{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | Sistema Planeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f6f8ff, #f3f8f4);
            min-height: 100vh;
        }
        .reset-card {
            max-width: 430px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 18px 42px rgba(32, 60, 130, 0.08);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="card reset-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="{% static 'api_central/img/logo_empresa.png' %}" alt="Logo Empresa" style="max-height: 70px;" class="mb-3">
                <h3 class="fw-bold text-dark">Restablecer contraseña</h3>
                <p class="text-muted mb-0">Define una nueva clave para acceder al panel.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small">Nueva contraseña</label>
                    <input type="password" class="form-control" name="new_password" placeholder="Ingresa una nueva clave" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small">Confirmar contraseña</label>
                    <input type="password" class="form-control" name="confirm_password" placeholder="Repite la contraseña" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Guardar nueva contraseña</button>
            </form>

            <div class="text-center mt-4 small text-muted">
                <a href="{% url 'login_root' %}" class="text-decoration-none">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
