{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Sistema Planeta</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9; /* Un gris muy suave para el fondo */
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 login-card">
        <div class="card-body p-4 text-center">
            
            <!-- Logo de la empresa -->
            <img src="{% static 'api_central/img/logo_empresa.png' %}" alt="Logo Empresa" class="mb-4" style="max-height: 80px;">
            
            <h5 class="mb-4 text-secondary">Acceso Administrativo</h5>

            <!-- Formulario de Login -->
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="usuarioInput" name="username" placeholder="Usuario" required>
                    <label for="usuarioInput">Usuario (Ej: admin)</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Contraseña" required>
                    <label for="passwordInput">Contraseña</label>
                </div>
                
                <button class="btn btn-primary w-100 py-2" type="submit">
                    Ingresar al Sistema
                </button>
            </form>
            
            <div class="mt-3 d-flex justify-content-between">
                <a href="{% url 'recuperar_password' %}" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>
                <a href="{% url 'registro' %}" class="text-decoration-none small text-muted">Crear cuenta</a>
            </div>

        </div>
    </div>

</body>
</html>
