{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | Sistema Planeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f3f6fb;
            min-height: 100vh;
        }
        .recover-card {
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="card recover-card border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="{% static 'api_central/img/logo_empresa.png' %}" alt="Logo Empresa" style="max-height: 70px;" class="mb-3">
                <h3 class="fw-bold text-dark">Recuperar acceso</h3>
                <p class="text-muted mb-0">Ingresa tu correo para recibir instrucciones de recuperación.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted small">Correo electrónico</label>
                    <input type="email" class="form-control" name="email" placeholder="usuario@tuempresa.cl" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Enviar enlace</button>
            </form>

            <div class="text-center mt-4 small text-muted">
                <a href="{% url 'login_root' %}" class="text-decoration-none">Volver al login</a>
            </div>
        </div>
    </div>
</body>
</html>
