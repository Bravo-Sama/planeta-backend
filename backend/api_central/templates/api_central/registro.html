{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Sistema Planeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8fbff, #eef3ff);
            min-height: 100vh;
        }
        .auth-card {
            max-width: 460px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(13, 110, 253, 0.12);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="{% static 'api_central/img/logo_empresa.png' %}" alt="Logo Empresa" class="mb-3" style="max-height: 78px;">
                <h3 class="fw-bold text-dark mb-1">Crear cuenta</h3>
                <p class="text-muted mb-0">Registro de nuevo usuario del sistema IA</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small">Nombre completo</label>
                    <input type="text" class="form-control" name="nombre" placeholder="Ej: María López" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small">Usuario</label>
                    <input type="text" class="form-control" name="username" placeholder="Ej: mlopez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small">Correo corporativo</label>
                    <input type="email" class="form-control" name="email" placeholder="nombre@tuempresa.cl" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small">Contraseña</label>
                    <input type="password" class="form-control" name="password" placeholder="Mínimo 8 caracteres" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrar usuario</button>
            </form>

            <div class="text-center mt-4 small text-muted">
                ¿Ya tienes acceso? <a href="{% url 'login_root' %}" class="text-decoration-none fw-semibold">Inicia sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
